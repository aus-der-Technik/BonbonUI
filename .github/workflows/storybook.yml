name: Storybook

# Builds Storybook on every push and pull request; pushes to main also publish the static
# build to the `gh-pages` branch, which GitHub Pages serves.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time; a newer push to the same ref supersedes a running build.
concurrency:
  group: storybook-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      # No lockfile is committed, so `npm ci` is not an option.
      - run: npm install --no-audit --no-fund

      - run: npm run build-storybook

      - uses: actions/upload-artifact@v4
        with:
          name: storybook-static
          path: storybook-static
          retention-days: 7

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: storybook-static
          path: storybook-static

      # Each build renames its hashed chunks. A page opened (or cached) before this deploy still
      # asks for the old names, so the previous deploy's chunks stay one more generation: only
      # those listed in its manifest, so carried-over files do not pile up.
      - uses: actions/checkout@v5
        continue-on-error: true
        with:
          ref: gh-pages
          path: previous

      - name: Keep the previous deploy's chunks
        run: |
          (cd storybook-static/assets && ls -1) > storybook-static/assets-manifest.txt
          [ -d previous/assets ] || exit 0
          # A deploy from before the manifest existed holds only its own chunks.
          [ -f previous/assets-manifest.txt ] || (cd previous/assets && ls -1) > previous/assets-manifest.txt
          while IFS= read -r f; do
            if [ -f "previous/assets/$f" ] && [ ! -e "storybook-static/assets/$f" ]; then
              cp "previous/assets/$f" storybook-static/assets/
            fi
          done < previous/assets-manifest.txt

      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: storybook-static
          publish_branch: gh-pages
          # Each deploy replaces the branch with a single commit instead of growing history.
          force_orphan: true
          commit_message: 'Deploy Storybook from ${{ github.sha }}'
